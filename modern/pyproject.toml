[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "famenet-modern"
version = "0.1.0"
description = "Modern PyTorch implementation of FAME-Net (AAAI 2024)"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24"]
[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.10"]
[project.scripts]
famenet = "famenet.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
