<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-labelledby="t d"><title id="t">FAME-Net conceptual architecture</title><desc id="d">Separate spatial mask and per-image expert routing; high and low frequency features fused into multispectral image.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#728b8c"/></marker><pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#e5d6bc"/><path d="M0 6h12M6 0v12" stroke="#7f9d8d" stroke-width="2"/></pattern></defs><rect width="1120" height="450" rx="18" fill="#f5f8f6"/><g font-family="Arial,sans-serif" fill="#193b39"><text x="28" y="35" font-size="13" font-weight="bold" letter-spacing="2">FREQUENCY-ADAPTIVE PAN-SHARPENING</text><text x="1092" y="35" text-anchor="end" font-size="12" fill="#536e6c">Conceptual diagram · original illustration</text><g fill="none" stroke="#728b8c" stroke-width="2.5" marker-end="url(#a)"><path d="M155 119H189"/><path d="M155 284H189"/><path d="M325 119H348V196H372"/><path d="M325 284H348V232H372"/><path d="M531 214H556V120H585"/><path d="M531 214H556V287H585"/><path d="M751 120H779V196H807"/><path d="M751 287H779V232H807"/><path d="M964 214H991"/></g><g font-size="14" text-anchor="middle"><rect x="30" y="75" width="125" height="88" rx="12" fill="#fff" stroke="#c7d8d3"/><rect x="45" y="87" width="95" height="38" fill="url(#grid)"/><text x="92" y="147" font-weight="bold">LRMS · 4 bands</text><rect x="30" y="240" width="125" height="88" rx="12" fill="#fff" stroke="#c7d8d3"/><rect x="45" y="252" width="95" height="38" fill="#adb9bc"/><path d="M46 285l32-27 20 20 20-20 21 27" stroke="#57686f" stroke-width="4" fill="none"/><text x="92" y="312" font-weight="bold">PAN · 1 band</text><rect x="189" y="75" width="136" height="88" rx="12" fill="#edf2f0" stroke="#b7cbc5"/><text x="257" y="112" font-weight="bold">Upsample</text><text x="257" y="133">MS encoder</text><rect x="189" y="240" width="136" height="88" rx="12" fill="#edf2f0" stroke="#b7cbc5"/><text x="257" y="289" font-weight="bold">PAN encoder</text><rect x="372" y="163" width="159" height="102" rx="12" fill="#fff1d8" stroke="#c9ae73"/><text x="451.5" y="192" font-weight="bold">Mask predictor</text><text x="451.5" y="216">Gumbel-Softmax</text><text x="451.5" y="240">HF / LF split</text><rect x="585" y="69" width="166" height="102" rx="12" fill="#dcece9" stroke="#83b5a8"/><text x="668" y="98" font-weight="bold">HF-MoE</text><text x="668" y="123">HIN experts</text><text x="668" y="148" fill="#266b60" font-weight="bold">Top-2 of 4</text><rect x="585" y="236" width="166" height="102" rx="12" fill="#e5ebf5" stroke="#9caecc"/><text x="668" y="265" font-weight="bold">LF-MoE</text><text x="668" y="290">Conv experts</text><text x="668" y="315" fill="#3b5b91" font-weight="bold">Top-2 of 4</text><rect x="807" y="163" width="157" height="102" rx="12" fill="#d9e6e0" stroke="#82a598"/><text x="885.5" y="191" font-weight="bold">Fusion MoE</text><text x="885.5" y="215">MS + PAN + LF + HF</text><text x="885.5" y="240" font-weight="bold">Top-2 → 1×1</text><rect x="991" y="171" width="101" height="85" rx="12" fill="#fff" stroke="#c7d8d3"/><rect x="1002" y="183" width="79" height="40" fill="url(#grid)"/><text x="1041.5" y="243" font-weight="bold">HRMS</text></g><path d="M257 328V373H885V265" fill="none" stroke="#728b8c" stroke-dasharray="5 5" stroke-width="2" marker-end="url(#a)"/><text x="570" y="393" font-size="13" text-anchor="middle" fill="#536e6c">Original MS and PAN features also enter the fusion module.</text><text x="28" y="430" font-size="13" fill="#536e6c">Spatial mask prediction is per pixel; each expert bank routes per image. DCT-derived labels supervise the mask during training only.</text></g></svg>